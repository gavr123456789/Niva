name: Go self-hosting

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-self-hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
      - name: Check Kotlin binding manifest loader
        working-directory: Niva/Niva
        run: ./gradlew --no-daemon test --tests "NivaBuildIntegrationTest.kotlin source loader uses manifest providers before parsing"
      - name: Build and check Go self-hosting compiler
        run: sh Niva/NivaInNiva/scripts/go-self-hosting-check.sh
